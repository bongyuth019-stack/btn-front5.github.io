<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<style>
    .group-btn{
        margin:30px;
    }
    /*main-class*/
    .group-btn h3{
        /*font-size​​ កំណត់ទំហំ */
        font-size:35px;
        /*font-family កំណត់ស្ទាយអក្សរ */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    }
    button{
        /*12px top-bottom 32px left-right*/
        padding:15px 32px;
        margin-right: 20px;
    }
    .group-btn .btn1{
        color:white;
        background-color: blue;
        /*border:none delete border*/
        border: none;
        border: 2px solid gray;
        /*border-radius make circle border*/
        border-radius: 4px;
        cursor: pointer;
    }
    .group-btn .btn2{
        border:none;
        background-color: black;
        color:white;
        border:2px solid gray;
        border-radius:4px;
        cursor:pointer;
    }
    .group-btn .btn3{
        /*transparent used for none backgroud-color*/
        background-color: transparent;
        border:2px solid gray;
        border-radius: 50px;
        cursor: pointer;
    }
    .group-btn .btn4{
        color:white;
        background-color: green;
        /*border:none delete border*/
        border: none;
        border: 2px solid gray;
        /*border-radius make circle border*/
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
    }
    /*hover for value backgroun-color*/
    .group-btn .btn4:hover{
        background-color: #f616e7e0;
    }
    .group-btn .btn5{
        border:none;
        background-color: rgba(99, 2, 2, 0.879);
        color:white;
        border:2px solid gray;
        border-radius:4px;
        cursor:pointer;
        outline: none;
        transition: all 0.3s;
    }
    .group-btn .btn5:hover{
        background-color: blue;
    }
    .group-btn .btn6{
        background-color: transparent;
        color:blue;
        border:none;
        outline: 2px solid blue;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .group-btn .btn6:hover{
        background-color: black;
        color: white;
        outline:none;
    }
    .group-btn .btn7{
        background-color:blue;
        color: white;
        border:none;
        border-radius:4px;
        cursor:pointer;
        transition:all 0.3s;

    }
    .group-btn .btn7:hover{
        transform: scale(1.1);
    }
    .group-btn .btn8{
        background-color: black;
        color:white;
        border:none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .group-btn .btn8:hover{
        background-color: blue;
        /*transform: rotate for change degree*/
        transform:rotate(10deg);
    }
    .group-btn .btn9{
        background-color: purple;
        color: white;
        border:none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .group-btn .btn9:hover{
        transform:scale(0.9)
    }
</style>
<body>
    <div class="group-btn">
        <h3>Primary</h3>
        <button class="btn1">Primary-btn</button>
        <button class="btn2">Primary-btn</button>
        <button class="btn3">Primary-btn</button>
    </div>
    <div class="group-btn">
        <h3>Primary</h3>
        <button class="btn4">Primary-btn</button>
        <button class="btn5">Primary-btn</button>
        <button class="btn6">Primary-btn</button>
    </div>
    <div class="group-btn">
        <h3>Primary</h3>
        <button class="btn7">Primary-btn</button>
        <button class="btn8">Primary-btn</button>
        <button class="btn9">Primary-btn</button>
    </div>
</body>
</html>
